name: Build iOS Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (iPhone)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Recreate iOS platform files with official Flutter scaffolding
        run: |
          rm -rf ios
          flutter create --platforms=ios --org com.example .

      - name: Verify Flutter & Dart
        run: |
          flutter doctor -v

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Run unit & widget tests
        run: |
          flutter test

      - name: Build iOS Application (no code signing)
        run: |
          flutter build ios --release --no-codesign

      - name: Package iOS Payload (Simulator / Ad-hoc IPA)
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r StudentPortfolio_iOS.zip Payload/
          mkdir -p build/ios
          mv StudentPortfolio_iOS.zip build/ios/

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-portfolio-ios-release
          path: build/ios/StudentPortfolio_iOS.zip
          retention-days: 14
